<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Probe Lab icon — sonar ping dissolving into pixels">
  <defs>
    <radialGradient id="bgGlow" cx="0.5" cy="0.52" r="0.65">
      <stop offset="0" stop-color="#0B0A18"/>
      <stop offset="0.6" stop-color="#050509"/>
      <stop offset="1" stop-color="#010103"/>
    </radialGradient>
    <radialGradient id="nebulaP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#34E7F0"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#C6FBFF"/>
      <stop offset="0.75" stop-color="#34E7F0"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fadeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.5" stop-color="#fff"/>
      <stop offset="0.62" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="0.8" stop-color="#000"/>
    </linearGradient>
    <mask id="fade"><rect x="0" y="0" width="1024" height="1024" fill="url(#fadeGrad)"/></mask>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" fill="url(#bgGlow)"/>
  <ellipse cx="360" cy="690" rx="340" ry="260" fill="url(#nebulaP)" filter="url(#soft)"/>
  <ellipse cx="740" cy="470" rx="300" ry="240" fill="url(#nebulaC)" filter="url(#soft)"/>

  <g mask="url(#fade)" filter="url(#glow)" fill="none" stroke="url(#ring)" stroke-linecap="round">
    <circle cx="512" cy="512" r="300" stroke-width="10" stroke-opacity="0.45"/>
    <circle cx="512" cy="512" r="232" stroke-width="12" stroke-opacity="0.7"/>
    <circle cx="512" cy="512" r="166" stroke-width="14" stroke-opacity="0.9"/>
    <circle cx="512" cy="512" r="102" stroke-width="16"/>
  </g>

  <g stroke="#34E7F0" stroke-linecap="round" filter="url(#glow)">
    <line x1="512" y1="512" x2="712" y2="356" stroke-width="7" stroke-opacity="0.9"/>
  </g>
  <path d="M512 512 L735 345 L772 486 Z" fill="#34E7F0" opacity="0.08"/>

  <circle cx="512" cy="512" r="74" fill="url(#core)" filter="url(#glow)"/>
  <circle cx="512" cy="512" r="26" fill="#EBFEFF"/>

  <g fill="#5BE8F2" filter="url(#glow)">
    <rect x="648" y="452" width="34" height="34" rx="4" opacity="0.95"/>
    <rect x="700" y="500" width="28" height="28" rx="4" opacity="0.85"/>
    <rect x="690" y="430" width="22" height="22" rx="3" opacity="0.8"/>
    <rect x="742" y="470" width="26" height="26" rx="3" opacity="0.7"/>
    <rect x="736" y="534" width="20" height="20" rx="3" opacity="0.7"/>
    <rect x="782" y="508" width="22" height="22" rx="3" opacity="0.55"/>
    <rect x="778" y="446" width="16" height="16" rx="2" opacity="0.5"/>
  </g>
  <g fill="#8FD0FF">
    <rect x="814" y="486" width="16" height="16" rx="2" opacity="0.5"/>
    <rect x="800" y="560" width="18" height="18" rx="2" opacity="0.45"/>
    <rect x="836" y="524" width="12" height="12" rx="2" opacity="0.4"/>
    <rect x="760" y="586" width="16" height="16" rx="2" opacity="0.5"/>
    <rect x="860" y="500" width="10" height="10" rx="2" opacity="0.3"/>
    <rect x="712" y="572" width="18" height="18" rx="2" opacity="0.55"/>
    <rect x="828" y="452" width="10" height="10" rx="2" opacity="0.3"/>
    <rect x="884" y="528" width="9" height="9" rx="2" opacity="0.25"/>
  </g>

  <g fill="#B8EAFF">
    <circle cx="300" cy="360" r="2.5" opacity="0.5"/>
    <circle cx="250" cy="520" r="2" opacity="0.4"/>
    <circle cx="360" cy="640" r="2.5" opacity="0.45"/>
    <circle cx="640" cy="690" r="2" opacity="0.4"/>
    <circle cx="420" cy="300" r="2" opacity="0.35"/>
    <circle cx="560" cy="760" r="2.5" opacity="0.4"/>
    <circle cx="820" cy="620" r="2" opacity="0.3"/>
    <circle cx="200" cy="430" r="1.8" opacity="0.3"/>
    <circle cx="700" cy="300" r="2" opacity="0.35"/>
  </g>
</svg>
