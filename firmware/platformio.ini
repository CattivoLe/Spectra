[platformio]
# `pio run` builds the firmware; the host test env is opt-in via `pio test -e native`.
default_envs = m5stack-cardputer-adv

[env:m5stack-cardputer-adv]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.flash_mode = qio
board_upload.flash_size = 8MB
lib_ldf_mode = deep
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_RUNNING_CORE=1
lib_deps =
    https://github.com/m5stack/M5Cardputer.git
    h2zero/NimBLE-Arduino@^2.3.0
    jgromes/RadioLib@7.8.1

# ESP32-C5-DevKitC-1 N4: 4 MB flash, USB-Serial/JTAG, 2.4 and 5 GHz. No screen.
#   pio run -e esp32-c5-n4 -t upload
[env:esp32-c5-n4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c5-devkitc1-n4
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.flash_size = 4MB
board_build.partitions = partitions_4MB.csv
board_upload.flash_size = 4MB
lib_ldf_mode = deep
build_src_filter = +<*> -<LoraCap.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DSPECTRA_BOARD_C5
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.0

# ESP32-WROOM-32 on a dev board whose USB port is a CH340 UART. 2.4 GHz only.
# No screen. If upload fails, drop upload_speed to 115200.
#   pio run -e esp32-wroom32-ch340 -t upload
[env:esp32-wroom32-ch340]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.flash_size = 4MB
board_build.partitions = partitions_4MB.csv
board_upload.flash_size = 4MB
lib_ldf_mode = deep
build_src_filter = +<*> -<LoraCap.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DSPECTRA_BOARD_WROOM32
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.0

# Host-side unit tests for the hardware-independent modules (Crc32, Bytes).
# Run with: pio test -e native
[env:native]
platform = native
build_src_filter = -<*>
build_flags = -std=gnu++17 -I src
